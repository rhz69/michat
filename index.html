<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#008069">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Chat">
<title>Mi Chat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
:root{
  --bg:#efeae2; --pattern:#e3dccf; --bar:#f0f2f5; --head:#008069; --head-fg:#ffffff;
  --in:#ffffff; --out:#d9fdd3; --fg:#111b21; --muted:#667781; --accent:#00a884; --tick:#53bdeb;
  --panel:#ffffff; --line:#e1e4e7; --field:#ffffff; --chip:#e7f7f1; --danger:#d0384b; --warn:#fff4d6;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b141a; --pattern:#111c22; --bar:#1f2c34; --head:#1f2c34; --head-fg:#e9edef;
  --in:#202c33; --out:#005c4b; --fg:#e9edef; --muted:#8696a0; --accent:#00a884;
  --panel:#111b21; --line:#2a3942; --field:#2a3942; --chip:#1d3b34; --danger:#f15c6d; --warn:#3a3320; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;
  padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
[hidden]{display:none!important}
.app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;position:relative;overflow:hidden}
header{background:var(--head);color:var(--head-fg);display:flex;align-items:center;gap:12px;
  padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;flex:none;background:var(--accent)}
.who{flex:1;min-width:0;cursor:pointer}
.who b{display:block;font-size:16.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{font-size:13px;opacity:.85}
.iconbtn{background:none;border:0;color:inherit;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.iconbtn:hover,.iconbtn:focus-visible{background:rgba(255,255,255,.14);outline:none}
.iconbtn svg{width:22px;height:22px}
#msgs{flex:1;overflow-y:auto;padding-block:14px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:4px;background-color:var(--bg);
  background-image:radial-gradient(var(--pattern) 1.4px,transparent 1.6px),radial-gradient(var(--pattern) 1.4px,transparent 1.6px);
  background-size:26px 26px;background-position:0 0,13px 13px}
.day{align-self:center;background:var(--in);color:var(--muted);font-size:12.5px;padding:5px 12px;border-radius:8px;margin-block:6px;box-shadow:0 1px .5px rgba(0,0,0,.13)}
.note{align-self:center;max-width:92%;text-align:center;background:var(--warn);color:var(--fg);font-size:13.5px;padding:10px 14px;border-radius:8px;margin-bottom:6px;line-height:1.45}
.note button{margin-top:8px}
.msg{max-width:min(80%,520px);padding:6px 8px 8px 9px;border-radius:8px;line-height:1.38;box-shadow:0 1px .5px rgba(0,0,0,.13);white-space:pre-wrap;overflow-wrap:anywhere}
.msg.in{align-self:flex-start;background:var(--in);border-top-left-radius:0}
.msg.out{align-self:flex-end;background:var(--out);border-top-right-radius:0}
.msg.first{margin-top:6px}
.meta{float:right;margin:6px 0 -4px 10px;font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.meta svg{width:16px;height:11px;color:var(--tick)}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none}}
form.bar{display:flex;gap:8px;align-items:flex-end;background:var(--bar);
  padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
#text{flex:1;min-width:0;resize:none;border:0;border-radius:22px;background:var(--field);color:var(--fg);font:inherit;font-size:16px;padding:11px 16px;max-height:120px;line-height:1.35}
#text:focus{outline:2px solid var(--accent)}
#send{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer}
#send:disabled{opacity:.55;cursor:default}
#send svg{width:22px;height:22px}
.sheet{position:absolute;inset:0;background:var(--panel);display:flex;flex-direction:column;z-index:5}
.sheet header b{font-size:17px;flex:1}
.form{flex:1;overflow-y:auto;padding-block:20px 40px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.photo{display:flex;flex-direction:column;align-items:center;gap:10px}
.photo img{width:132px;height:132px;border-radius:50%;object-fit:cover;background:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{border:1px solid var(--line);background:var(--field);color:var(--fg);font:inherit;font-weight:600;font-size:14px;padding:9px 16px;border-radius:20px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.03em;text-transform:uppercase}
label.f input,label.f textarea{font:inherit;font-size:16px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
label.f textarea{min-height:120px;resize:vertical;line-height:1.45}
label.f input:focus,label.f textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.hint{font-size:13px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:400;line-height:1.45}
.hint a{color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--fg);font:inherit;font-size:13.5px;padding:7px 12px;border-radius:16px;cursor:pointer}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.sep{border:0;border-top:1px solid var(--line);margin:0}
</style>
</head>
<body>
<div class="app">
  <header>
    <img class="avatar" id="hAvatar" alt="">
    <div class="who" id="openWho" tabindex="0" role="button" aria-label="Abrir ajustes">
      <b id="hName">Sofía</b>
      <small id="hStatus">en línea</small>
    </div>
    <button class="iconbtn" id="openSettings" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
    </button>
  </header>

  <div id="msgs" aria-live="polite"></div>

  <form class="bar" id="bar">
    <textarea id="text" rows="1" placeholder="Escribe un mensaje" aria-label="Mensaje"></textarea>
    <button id="send" type="submit" aria-label="Enviar">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>
    </button>
  </form>

  <section class="sheet" id="sheet" hidden>
    <header>
      <button class="iconbtn" id="closeSettings" aria-label="Volver">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>
      </button>
      <b>Ajustes</b>
    </header>
    <div class="form">
      <div class="photo">
        <img id="sAvatar" alt="Foto del contacto">
        <div class="row">
          <button class="btn" type="button" id="pickPhoto">Cambiar foto</button>
          <button class="btn" type="button" id="resetPhoto">Quitar foto</button>
        </div>
        <input type="file" id="photoFile" accept="image/*" hidden>
      </div>

      <label class="f" for="nameIn">Nombre
        <input id="nameIn" maxlength="40" autocomplete="off">
      </label>

      <label class="f" for="persIn">Cómo actúa
        <span class="hint">Describe su personalidad, cómo habla, de dónde es, qué le gusta.</span>
        <textarea id="persIn" maxlength="3000"></textarea>
      </label>

      <div>
        <div class="hint" style="margin-bottom:8px">Ideas rápidas (reemplazan el texto):</div>
        <div class="chips" id="presets"></div>
      </div>

      <hr class="sep">

      <label class="f" for="keyIn">Clave de Google Gemini
        <span class="hint">Consíguela gratis en <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> → "Create API key", cópiala y pégala aquí. Se guarda solo en este navegador.</span>
        <input id="keyIn" type="password" autocomplete="off" spellcheck="false" placeholder="AIza...">
      </label>

      <label class="f" for="modelIn">Modelo
        <span class="hint">Déjalo así si no sabes. Si falla, prueba <b>gemini-3.8-flash</b>.</span>
        <input id="modelIn" autocomplete="off" spellcheck="false">
      </label>

      <div class="actions">
        <button class="btn primary" type="button" id="save">Guardar</button>
        <div class="confirm">
          <button class="btn danger" type="button" id="clear">Borrar chat</button>
          <span id="clearAsk" hidden>¿Seguro? <button class="btn danger" type="button" id="clearYes">Sí, borrar</button> <button class="btn" type="button" id="clearNo">No</button></span>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const PRESETS = {
  "Amiga alegre": "Es chilena, alegre y cercana. Habla relajado, usa expresiones como 'po' o 'cachai' de vez en cuando y algún emoji. Le encanta la música, las series y salir con amigas. Pregunta por tu día y se acuerda de lo que le cuentas.",
  "Tranquila y sabia": "Es calmada, cálida y reflexiva. Escucha con paciencia, da buenos consejos sin sermonear y habla con frases cortas y amables. Le gusta leer, el té y caminar por la naturaleza.",
  "Sarcástica": "Es ingeniosa y un poco sarcástica, con humor seco, pero en el fondo es buena onda. Responde corto y directo, te molesta en buena y nunca es cruel.",
  "Profesora de inglés": "Es profesora de inglés paciente y simpática. Conversa en español, pero mete frases en inglés y te corrige con cariño cuando escribes en inglés."
};
const DEFAULT_MODEL = "gemini-flash-latest";
const FALLBACK_MODEL = "gemini-3.8-flash";
const DEFAULT = { name:"Sofía", photo:"", persona:PRESETS["Amiga alegre"], key:"", model:DEFAULT_MODEL };

function load(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch{ return d; } }
function store(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} }

let cfg = Object.assign({}, DEFAULT, load("bot.cfg",{}));
const now = () => new Date().toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});
let history = load("bot.history", null) || [{ role:"assistant", content:"Holaa 😊 ¿cómo estás? Cuéntame algo de tu día", t:now() }];
let draftPhoto = cfg.photo, busy = false, notice = "";

function initialAvatar(name){
  const c=document.createElement("canvas"); c.width=c.height=160; const x=c.getContext("2d");
  let h=0; for(const ch of name) h=(h*31+ch.charCodeAt(0))%360;
  x.fillStyle=`hsl(${(h+150)%360} 45% 52%)`; x.fillRect(0,0,160,160);
  x.fillStyle="#fff"; x.font="600 72px system-ui, sans-serif"; x.textAlign="center"; x.textBaseline="middle";
  x.fillText((name.trim()[0]||"?").toUpperCase(),80,86);
  return c.toDataURL();
}
const avatarSrc = (p,n) => p || initialAvatar(n);

function paintHeader(){
  $("hName").textContent = cfg.name;
  $("hAvatar").src = avatarSrc(cfg.photo, cfg.name);
  document.title = cfg.name;
}

const tick='<svg viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 6l3 3 6-7.5M6 8.5l1 .8 6-7.5"/></svg>';
function bubble(m, prev){
  const d=document.createElement("div");
  d.className="msg "+(m.role==="user"?"out":"in")+(prev!==m.role?" first":"");
  const t=document.createElement("span"); t.textContent=m.content;
  const meta=document.createElement("span"); meta.className="meta";
  meta.innerHTML=`<span></span>${m.role==="user"?tick:""}`; meta.firstChild.textContent=m.t||"";
  d.append(t,meta); return d;
}
function render(){
  const box=$("msgs"); box.textContent="";
  const day=document.createElement("div"); day.className="day"; day.textContent="Hoy"; box.append(day);
  if(!cfg.key){
    const n=document.createElement("div"); n.className="note";
    n.textContent="Para que "+cfg.name+" te responda, falta pegar tu clave gratuita de Google Gemini en Ajustes.";
    const b=document.createElement("button"); b.className="btn primary"; b.type="button"; b.textContent="Abrir ajustes"; b.onclick=openSheet;
    n.append(document.createElement("br"), b); box.append(n);
  }
  let prev=null; for(const m of history){ box.append(bubble(m,prev)); prev=m.role; }
  if(notice){ const n=document.createElement("div"); n.className="note"; n.textContent=notice; box.append(n); }
  box.scrollTop=box.scrollHeight;
}

function systemText(){
  return `Vas a interpretar a un personaje en una app de mensajería tipo chat de teléfono.
Tu nombre es ${cfg.name}. Eres una mujer. Personalidad y forma de actuar:
${cfg.persona}

Reglas:
- Responde siempre como ${cfg.name}, en primera persona, en el idioma en que te escriban (por defecto español).
- Escribe como en un chat real: mensajes cortos (1 a 3 frases normalmente), naturales, sin listas, títulos ni markdown.
- No digas que eres una IA salvo que te lo pregunten directamente; en ese caso sé honesta.
- Mantén la conversación respetuosa y apropiada.`;
}

function buildContents(){
  const turns=[];
  for(const m of history.slice(-40)){
    const role = m.role==="user" ? "user" : "model";
    if(turns.length && turns[turns.length-1].role===role) turns[turns.length-1].parts[0].text += "\n" + m.content;
    else turns.push({ role, parts:[{ text:m.content }] });
  }
  while(turns.length && turns[0].role==="model") turns.shift();
  return turns;
}

async function callGemini(model){
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "x-goog-api-key":cfg.key },
    body: JSON.stringify({
      systemInstruction:{ parts:[{ text:systemText() }] },
      contents: buildContents(),
      generationConfig:{ temperature:0.9, maxOutputTokens:800 }
    })
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok){ const e=new Error(data?.error?.message||("HTTP "+res.status)); e.status=res.status; throw e; }
  if(data.promptFeedback?.blockReason){ const e=new Error("blocked"); e.blocked=true; throw e; }
  const text = (data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("").trim();
  if(!text){ const e=new Error("empty"); e.blocked=true; throw e; }
  return text;
}

async function send(text){
  if(busy || !text.trim()) return;
  notice="";
  history.push({ role:"user", content:text.trim(), t:now() });
  store("bot.history",history); render();
  if(!cfg.key) return;

  busy=true; $("send").disabled=true; $("hStatus").textContent="escribiendo...";
  const box=$("msgs"); const live=document.createElement("div"); live.className="msg in";
  live.innerHTML='<span class="typing"><i></i><i></i><i></i></span>'; box.append(live); box.scrollTop=box.scrollHeight;

  try{
    let reply;
    try{ reply = await callGemini(cfg.model||DEFAULT_MODEL); }
    catch(e){
      if(e.status===404 && cfg.model!==FALLBACK_MODEL){ reply = await callGemini(FALLBACK_MODEL); cfg.model=FALLBACK_MODEL; store("bot.cfg",cfg); }
      else throw e;
    }
    history.push({ role:"assistant", content:reply, t:now() });
  }catch(e){
    if(e.blocked) notice = cfg.name+" no respondió ese mensaje. Prueba diciéndolo de otra forma.";
    else if(e.status===400 || e.status===401 || e.status===403) notice = "Google rechazó la clave. Revisa en Ajustes que esté bien copiada.";
    else if(e.status===429) notice = "Llegaste al límite gratuito por ahora. Espera un minuto y vuelve a escribir.";
    else if(e.status===404) notice = "Ese modelo no existe. En Ajustes, cambia el modelo a gemini-3.8-flash.";
    else if(window.top !== window || location.protocol === "file:" ) notice = "Esta vista no deja conectarse a Google. Abre la página desde su link en Chrome (no dentro de otra app). Detalle: " + (e.message||e);
    else notice = "No se pudo conectar con Google. Detalle: " + (e.status ? "HTTP "+e.status+" " : "") + (e.message||e);
  }finally{
    busy=false; $("send").disabled=false; $("hStatus").textContent="en línea";
    store("bot.history",history); render();
  }
}

const ta=$("text");
ta.addEventListener("input",()=>{ ta.style.height="auto"; ta.style.height=Math.min(ta.scrollHeight,120)+"px"; });
ta.addEventListener("keydown",e=>{ if(e.key==="Enter" && !e.shiftKey && !/Android|iPhone|iPad/i.test(navigator.userAgent)){ e.preventDefault(); $("bar").requestSubmit(); } });
$("bar").addEventListener("submit",e=>{ e.preventDefault(); const v=ta.value; ta.value=""; ta.style.height="auto"; send(v); });

function openSheet(){
  draftPhoto=cfg.photo;
  $("nameIn").value=cfg.name; $("persIn").value=cfg.persona; $("keyIn").value=cfg.key; $("modelIn").value=cfg.model||DEFAULT_MODEL;
  $("sAvatar").src=avatarSrc(draftPhoto,cfg.name);
  $("clearAsk").hidden=true; $("clear").hidden=false; $("sheet").hidden=false;
}
$("openSettings").onclick=openSheet; $("openWho").onclick=openSheet;
$("openWho").onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openSheet(); } };
$("closeSettings").onclick=()=>{ $("sheet").hidden=true; };
$("nameIn").addEventListener("input",()=>{ if(!draftPhoto) $("sAvatar").src=initialAvatar($("nameIn").value||"?"); });

for(const k of Object.keys(PRESETS)){
  const b=document.createElement("button"); b.type="button"; b.className="chip"; b.textContent=k;
  b.onclick=()=>{ $("persIn").value=PRESETS[k]; }; $("presets").append(b);
}

$("pickPhoto").onclick=()=>$("photoFile").click();
$("resetPhoto").onclick=()=>{ draftPhoto=""; $("sAvatar").src=initialAvatar($("nameIn").value||"?"); };
$("photoFile").onchange=e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const img=new Image();
  img.onload=()=>{
    const s=320,c=document.createElement("canvas"); c.width=c.height=s; const x=c.getContext("2d"), m=Math.min(img.width,img.height);
    x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);
    draftPhoto=c.toDataURL("image/jpeg",.86); $("sAvatar").src=draftPhoto; URL.revokeObjectURL(img.src);
  };
  img.src=URL.createObjectURL(f); e.target.value="";
};

$("save").onclick=()=>{
  cfg={ name:$("nameIn").value.trim()||"Sofía", photo:draftPhoto, persona:$("persIn").value.trim()||DEFAULT.persona,
        key:$("keyIn").value.trim(), model:$("modelIn").value.trim()||DEFAULT_MODEL };
  store("bot.cfg",cfg); notice=""; paintHeader(); render(); $("sheet").hidden=true;
};
$("clear").onclick=()=>{ $("clear").hidden=true; $("clearAsk").hidden=false; };
$("clearNo").onclick=()=>{ $("clear").hidden=false; $("clearAsk").hidden=true; };
$("clearYes").onclick=()=>{ history=[{ role:"assistant", content:"Holaa 😊 ¿cómo estás?", t:now() }]; notice=""; store("bot.history",history); render(); $("sheet").hidden=true; };

paintHeader(); render();
</script>
</body>
</html>
